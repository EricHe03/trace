name: "Feature request"
description: "Suggest an idea or improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Please explain the problem you’re trying to solve.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: "As a user, I want..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
      placeholder: "Describe the ideal behavior."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds?
      placeholder: "Describe alternatives you've considered."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or related issues.
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues and didn’t find a duplicate.
          required: true
