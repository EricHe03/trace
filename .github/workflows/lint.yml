name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  swiftlint:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml --reporter github-actions-logging
