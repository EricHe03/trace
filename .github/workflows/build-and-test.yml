name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available schemes
        run: xcodebuild -list -project Trace.xcodeproj

      - name: Build for testing (simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project Trace.xcodeproj \
            -scheme Trace \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            build-for-testing | xcpretty || exit 1

      - name: Test without building
        run: |
          set -o pipefail
          xcodebuild \
            -project Trace.xcodeproj \
            -scheme Trace \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            test-without-building | xcpretty || exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: warn

      - name: Upload derived data (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: derived-data-logs
          path: DerivedData/Logs
          if-no-files-found: ignore
